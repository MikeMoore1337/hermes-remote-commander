name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:e2e
        env: { E2E_PORT: '3555', BRC_DEBUG: '1' }
      - run: pnpm test:hermes
      - name: Test shell and file isolation in a disposable Linux container
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/brc-workspace"
          mkdir -p "$workspace"
          chmod 0777 "$workspace"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 768m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -e BRC_HOME=/workspace/home/.brc \
            -v "$GITHUB_WORKSPACE:/app:ro" -v "$workspace:/workspace:rw" \
            -w /workspace node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5 node /app/scripts/h15_brc_sandbox_linux_e2e.mjs
      - name: pack npm tarballs
        if: matrix.os == 'ubuntu-latest'
        run: pnpm pack:all
      - name: Verify notices in npm tarballs
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check-package-notices.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'ubuntu-latest'
        with: { name: npm-tarballs, path: dist-pack/*.tgz }

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build fork relay with exact checked-out source revision
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          docker build --build-arg HERMES_SOURCE_REVISION="$source_sha" \
            -f packages/relay/Dockerfile -t brc/relay:ci .
      - name: Verify fork relay OCI source label and runtime entrypoint
        shell: bash
        run: |
          set -euo pipefail
          export H454_EXPECTED_SOURCE_SHA="$(git rev-parse HEAD)"
          docker image inspect brc/relay:ci | node -e '
            let raw = "";
            process.stdin.on("data", c => raw += c);
            process.stdin.on("end", () => {
              const [image] = JSON.parse(raw);
              const cfg = image?.Config ?? {};
              const labels = cfg.Labels ?? {};
              const env = cfg.Env ?? [];
              if (labels["org.opencontainers.image.source"] !==
                  "https://github.com/MikeMoore1337/hermes-remote-commander" ||
                  labels["org.opencontainers.image.revision"] !== process.env.H454_EXPECTED_SOURCE_SHA ||
                  cfg.User !== "rdp" ||
                  JSON.stringify(cfg.Cmd) !== JSON.stringify(["node", "dist/cli.js"]) ||
                  Object.keys(cfg.Volumes || {}).length !== 0 ||
                  !env.includes("BRC_DB=/data/relay.sqlite")) {
                console.error("H454_FORK_IMAGE_SOURCE_OR_RUNTIME_MISMATCH");
                process.exitCode = 1;
              } else {
                console.log("H454_FORK_IMAGE_SOURCE_LABEL_AND_RUNTIME=PASS_CI_ONLY");
              }
            });
          '
      - name: Verify Compose builds this fork and explicitly mounts SQLite state
        shell: bash
        env:
          PUBLIC_URL: http://127.0.0.1:3000
          BRC_ADMIN_PASSWORD: synthetic-ci-only
          BRC_SESSION_SECRET: synthetic-ci-only
        run: |
          set -euo pipefail
          docker compose --profile local --profile cloud config --format json | node -e '
            let content = "";
            process.stdin.on("data", chunk => content += chunk);
            process.stdin.on("end", () => {
              const spec = JSON.parse(content);
              for (const name of ["relay", "relay-cloud"]) {
                const service = spec.services[name];
                if (!service || service.pull_policy !== "build" ||
                    service.build?.dockerfile !== "packages/relay/Dockerfile" ||
                    !service.image.startsWith("hermes-remote-commander/relay:") ||
                    !service.volumes?.some(m => m.type === "volume" && m.target === "/data")) {
                  console.error("H454_COMPOSE_UPSTREAM_OR_IMPLICIT_STATE");
                  process.exitCode = 1;
                  return;
                }
              }
              console.log("H454_FORK_COMPOSE_SOURCE_AND_STATE=PASS");
            });
          '
      - name: Refuse relay image implicit writable volumes (disposable inspection)
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges brc/relay:ci)"
          trap 'docker rm -v "$cid" >/dev/null 2>&1 || true' EXIT
          docker inspect "$cid" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const [c] = JSON.parse(data);
              if (Object.keys(c.Config.Volumes || {}).length !== 0 || c.Mounts.length !== 0) {
                console.error("H454_UNAPPROVED_IMAGE_VOLUME");
                process.exitCode = 1;
              } else if (c.HostConfig.ReadonlyRootfs !== true || c.HostConfig.Privileged !== false) {
                console.error("H454_CONTAINER_SECURITY_CONTRACT_CHANGED");
                process.exitCode = 1;
              } else {
                console.log("H454_EXPLICIT_RELAY_STATE_VOLUME=PASS");
              }
            });
          '
      - run: docker build -f packages/agent/Dockerfile -t brc/agent:ci .
      - name: Verify notices in both images
        run: |
          docker run --rm --network none --entrypoint node brc/agent:ci -e "const f=require('node:fs'); for(const p of ['LICENSE','NOTICE','THIRD_PARTY_NOTICES.md','licenses/GPL-3.0.txt','licenses/LGPL-3.0.txt']) if(!f.existsSync(p)) process.exit(1)"
          docker run --rm --network none --entrypoint node brc/relay:ci -e "const f=require('node:fs'),p=require('node:path'); const a=p.dirname(p.dirname(require.resolve('brc-agent'))); for(const x of ['LICENSE','NOTICE','THIRD_PARTY_NOTICES.md','licenses/GPL-3.0.txt','licenses/LGPL-3.0.txt']) if(!f.existsSync(p.join(a,x))) process.exit(1); for(const x of ['LICENSE','NOTICE']) if(!f.existsSync(x)) process.exit(1)"
          for image in brc/agent:ci brc/relay:ci; do
            docker run --rm --network none --entrypoint node "$image" --input-type=module -e "import {fileURLToPath} from 'node:url'; import {dirname,join} from 'node:path'; import {readFileSync} from 'node:fs'; const root=dirname(dirname(fileURLToPath(import.meta.resolve('brc-shared')))); for(const f of ['LICENSE','NOTICE']) if(!readFileSync(join(root,f)).equals(readFileSync(f))) process.exit(1)"
          done
      - name: Verify standalone relay includes the pinned agent schemas
        run: |
          docker run --rm --network none --entrypoint node brc/relay:ci --input-type=module -e "import('./dist/mcp/hermes-tool-catalog.js').then(({pinnedToolCatalog}) => { if (!pinnedToolCatalog().some(t => t.name === 'read_file')) process.exit(1); })"
      - name: Verify fork relay under legacy-style UID and SQLite state mount (synthetic)
        run: bash scripts/h454_fork_legacy_state_smoke.sh brc/relay:ci
      - name: Exercise OAuth MCP with two isolated agent containers
        run: bash scripts/hermes-two-agents-docker-e2e.sh brc/relay:ci brc/agent:ci
      - name: smoke relay image
        run: |
          docker run -d --name relay -p 3000:3000 -e PUBLIC_URL=http://localhost:3000 -e BRC_ADMIN_PASSWORD=ci -e BRC_SESSION_SECRET=ci brc/relay:ci
          for i in $(seq 1 20); do curl -fs http://localhost:3000/health && break; sleep 1; done
          curl -fs http://localhost:3000/.well-known/oauth-authorization-server | grep -q authorization_endpoint
      - name: Inventory exact OCI OS and native dependencies (no publication)
        shell: bash
        run: bash scripts/h15_image_inventory.sh brc/agent:ci brc/relay:ci "$RUNNER_TEMP/h15-image-inventory"
      - name: Verify native sharp PNG rendering in isolated agent image
        shell: bash
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node brc/agent:ci -e '
              const sharp = require("sharp");
              sharp({ create: { width: 2, height: 2, channels: 3, background: "#00ff00" } })
                .png().toBuffer()
                .then(bytes => {
                  if (bytes.subarray(0, 8).toString("hex") !== "89504e470d0a1a0a") {
                    throw new Error("INVALID_PNG_HEADER");
                  }
                  console.log("H15_SHARP_NATIVE_RENDER=PASS");
                })
                .catch(error => {
                  console.error("H15_SHARP_NATIVE_RENDER=FAIL " + error.name);
                  process.exitCode = 1;
                });
            '
      - name: Preserve sanitized OCI inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-image-inventory
          path: ${{ runner.temp }}/h15-image-inventory
          retention-days: 7

  # Hermes #764: a successful build does not replace an advisory database check.
  # Preserve full machine-readable reports even when pnpm reports vulnerabilities.
  dependency-security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Audit all and production dependencies, without severity suppression
        shell: bash
        run: |
          set +e
          pnpm audit --json > "$RUNNER_TEMP/brc-audit-full.json" 2>&1
          full_exit=$?
          pnpm audit --prod --json > "$RUNNER_TEMP/brc-audit-production.json" 2>&1
          production_exit=$?
          set -e
          printf 'FULL_AUDIT_EXIT=%s\nPRODUCTION_AUDIT_EXIT=%s\n' "$full_exit" "$production_exit"
          printf '\n=== Full pnpm audit ===\n'
          cat "$RUNNER_TEMP/brc-audit-full.json"
          printf '\n=== Production pnpm audit ===\n'
          cat "$RUNNER_TEMP/brc-audit-production.json"
          test -s "$RUNNER_TEMP/brc-audit-full.json"
          test -s "$RUNNER_TEMP/brc-audit-production.json"
          test "$full_exit" -eq 0
          test "$production_exit" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-security-audit
          path: ${{ runner.temp }}/brc-audit-*.json
          if-no-files-found: error
