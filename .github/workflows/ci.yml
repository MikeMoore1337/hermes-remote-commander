name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:e2e
        env: { E2E_PORT: '3555', BRC_DEBUG: '1' }
      - run: pnpm test:hermes
      - name: Test shell and file isolation in a disposable Linux container
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/brc-workspace"
          mkdir -p "$workspace"
          chmod 0777 "$workspace"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 768m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -e BRC_HOME=/workspace/home/.brc \
            -v "$GITHUB_WORKSPACE:/app:ro" -v "$workspace:/workspace:rw" \
            -w /workspace node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5 node /app/scripts/h15_brc_sandbox_linux_e2e.mjs
      - name: pack npm tarballs
        if: matrix.os == 'ubuntu-latest'
        run: pnpm pack:all
      - name: Verify notices in npm tarballs
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check-package-notices.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'ubuntu-latest'
        with: { name: npm-tarballs, path: dist-pack/*.tgz }

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker build -f packages/relay/Dockerfile -t brc/relay:ci .
      - run: docker build -f packages/agent/Dockerfile -t brc/agent:ci .
      - name: Verify notices in both images
        run: |
          docker run --rm --network none --entrypoint node brc/agent:ci -e "const f=require('node:fs'); for(const p of ['LICENSE','NOTICE','THIRD_PARTY_NOTICES.md','licenses/GPL-3.0.txt','licenses/LGPL-3.0.txt']) if(!f.existsSync(p)) process.exit(1)"
          docker run --rm --network none --entrypoint node brc/relay:ci -e "const f=require('node:fs'),p=require('node:path'); const a=p.dirname(p.dirname(require.resolve('brc-agent'))); for(const x of ['LICENSE','NOTICE','THIRD_PARTY_NOTICES.md','licenses/GPL-3.0.txt','licenses/LGPL-3.0.txt']) if(!f.existsSync(p.join(a,x))) process.exit(1); for(const x of ['LICENSE','NOTICE']) if(!f.existsSync(x)) process.exit(1)"
          for image in brc/agent:ci brc/relay:ci; do
            docker run --rm --network none --entrypoint node "$image" --input-type=module -e "import {fileURLToPath} from 'node:url'; import {dirname,join} from 'node:path'; import {readFileSync} from 'node:fs'; const root=dirname(dirname(fileURLToPath(import.meta.resolve('brc-shared')))); for(const f of ['LICENSE','NOTICE']) if(!readFileSync(join(root,f)).equals(readFileSync(f))) process.exit(1)"
          done
      - name: Verify standalone relay includes the pinned agent schemas
        run: |
          docker run --rm --network none --entrypoint node brc/relay:ci --input-type=module -e "import('./dist/mcp/hermes-tool-catalog.js').then(({pinnedToolCatalog}) => { if (!pinnedToolCatalog().some(t => t.name === 'read_file')) process.exit(1); })"
      - name: Exercise OAuth MCP with two isolated agent containers
        run: bash scripts/hermes-two-agents-docker-e2e.sh brc/relay:ci brc/agent:ci
      - name: smoke relay image
        run: |
          docker run -d --name relay -p 3000:3000 -e PUBLIC_URL=http://localhost:3000 -e BRC_ADMIN_PASSWORD=ci -e BRC_SESSION_SECRET=ci brc/relay:ci
          for i in $(seq 1 20); do curl -fs http://localhost:3000/health && break; sleep 1; done
          curl -fs http://localhost:3000/.well-known/oauth-authorization-server | grep -q authorization_endpoint
      - name: Inventory exact OCI OS and native dependencies (no publication)
        shell: bash
        run: bash scripts/h15_image_inventory.sh brc/agent:ci brc/relay:ci "$RUNNER_TEMP/h15-image-inventory"
      - name: Verify native sharp PNG rendering in isolated agent image
        shell: bash
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node brc/agent:ci -e '
              const sharp = require("sharp");
              sharp({ create: { width: 2, height: 2, channels: 3, background: "#00ff00" } })
                .png().toBuffer()
                .then(bytes => {
                  if (bytes.subarray(0, 8).toString("hex") !== "89504e470d0a1a0a") {
                    throw new Error("INVALID_PNG_HEADER");
                  }
                  console.log("H15_SHARP_NATIVE_RENDER=PASS");
                })
                .catch(error => {
                  console.error("H15_SHARP_NATIVE_RENDER=FAIL " + error.name);
                  process.exitCode = 1;
                });
            '
      - name: Preserve sanitized OCI inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h15-image-inventory
          path: ${{ runner.temp }}/h15-image-inventory
          retention-days: 7
